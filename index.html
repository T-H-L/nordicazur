<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NordicAzur · Property Care & Concierge</title>
  <style>
    :root {
      --primary: #1b4332;
      --primary-hover: #2d6a4f;
      --bg-light: #f8fafc;
      --text-dark: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --accent: #8c6d46;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text-dark); background-color: #fff; line-height: 1.6; }

    /* Header med garanti for én linje til nav på mobil */
    header { 
      background: #fff; 
      border-bottom: 1px solid var(--border); 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 0.85rem 1.25rem; 
    }
    
    .header-top { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      width: 100%; 
    }

    .logo-container { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--primary); }
    .logo-img { height: 36px; width: auto; object-fit: contain; }
    .logo-text { font-weight: 800; font-size: 1.2rem; letter-spacing: 0.5px; text-transform: uppercase; color: var(--primary); }
    
    .lang-select { padding: 0.3rem 0.5rem; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-family: inherit; font-size: 0.85rem; cursor: pointer; }

    nav { 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      margin-top: 0.6rem; 
      width: 100%;
    }
    
    @media (min-width: 769px) {
      header { display: flex; justify-content: space-between; align-items: center; }
      .header-top { width: auto; }
      nav { margin-top: 0; width: auto; gap: 1.5rem; justify-content: flex-end; }
    }

    nav a { text-decoration: none; color: var(--text-dark); font-weight: 600; font-size: 0.88rem; }
    nav a:hover { color: var(--primary); }

    /* Hero Section */
    .hero { padding: 3rem 1rem 2.5rem; max-width: 1200px; margin: 0 auto; }
    .hero-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; align-items: center; }
    @media (min-width: 900px) {
      .hero-grid { grid-template-columns: 1.1fr 0.9fr; }
    }

    .hero-content { text-align: left; }
    .hero-tag { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin-bottom: 0.5rem; }
    .hero h1 { font-size: 2.1rem; line-height: 1.2; font-weight: 800; color: var(--text-dark); margin-bottom: 0.85rem; }
    .hero-lead { font-size: 1.05rem; font-weight: 600; color: var(--text-dark); margin-bottom: 0.5rem; }
    .hero-sublead { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.75rem; font-style: italic; }
    .hero p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.6; }

    .hero-checklist { list-style: none; margin-bottom: 1.75rem; }
    .hero-checklist li { display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; font-weight: 600; color: var(--text-dark); margin-bottom: 0.5rem; }
    .hero-checklist li::before { content: "✓"; display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); font-size: 0.75rem; font-weight: bold; flex-shrink: 0; }

    .btn-cta { display: block; width: 100%; text-align: center; background-color: var(--primary); color: #fff; font-weight: 700; padding: 0.9rem 1.5rem; border-radius: 8px; text-decoration: none; font-size: 1rem; transition: background 0.2s ease; margin-bottom: 0.5rem; }
    .btn-cta:hover { background-color: var(--primary-hover); }
    .cta-note { font-size: 0.85rem; color: var(--text-muted); text-align: center; line-height: 1.4; }

    .hero-image-container { width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,0.1); border: 1px solid var(--border); align-self: center; }
    .hero-img { width: 100%; height: auto; max-height: 480px; object-fit: cover; display: block; }

    /* Features Highlights */
    .features { padding: 3.5rem 1rem; background-color: var(--bg-light); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .features-container { max-width: 1100px; margin: 0 auto; }
    .features h2 { text-align: center; margin-bottom: 2rem; font-size: 1.6rem; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; }
    .card { background: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); }
    .card-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .card h3 { font-size: 1.1rem; margin-bottom: 0.4rem; color: var(--text-dark); font-weight: 600; }
    .card p { font-size: 0.9rem; color: var(--text-muted); }

    /* About Section */
    .about { padding: 4rem 1rem; background-color: #fff; border-bottom: 1px solid var(--border); }
    .about-container { max-width: 1000px; margin: 0 auto; }
    .about h2 { font-size: 1.8rem; font-weight: 800; color: var(--text-dark); margin-bottom: 1rem; text-align: center; }
    .about-intro { font-size: 1.05rem; color: var(--text-muted); margin-bottom: 1.25rem; text-align: center; max-width: 850px; margin-left: auto; margin-right: auto; line-height: 1.7; }
    .about-lead { font-size: 1rem; color: var(--text-dark); margin-bottom: 2rem; text-align: center; line-height: 1.7; }
    
    .about-subtitle { font-size: 1.3rem; font-weight: 700; color: var(--text-dark); margin-bottom: 1.5rem; text-align: center; }
    .about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; }
    .about-card { background: var(--bg-light); padding: 1.5rem; border-radius: 10px; border: 1px solid var(--border); }
    .about-card h3 { font-size: 1.05rem; font-weight: 700; color: var(--primary); margin-bottom: 0.4rem; }
    .about-card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }

    .about-footer { margin-top: 2.5rem; text-align: center; font-size: 1rem; font-weight: 600; color: var(--text-dark); max-width: 800px; margin-left: auto; margin-right: auto; }

    /* Pricing Section */
    .pricing { padding: 4rem 1rem 2rem; max-width: 1150px; margin: 0 auto; }
    .pricing h2 { text-align: center; font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; }
    .pricing-subtitle { text-align: center; color: var(--text-muted); margin-bottom: 2.5rem; font-size: 1rem; }
    .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.75rem; align-items: stretch; }
    
    .price-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 2rem 1.5rem; display: flex; flex-direction: column; position: relative; transition: transform 0.2s, box-shadow 0.2s; }
    .price-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.06); }
    .price-card.popular { border: 2px solid var(--primary); }
    .popular-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #fff; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 0.3rem 0.75rem; border-radius: 20px; letter-spacing: 1px; }
    
    .price-card h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-dark); }
    .price-features { list-style: none; margin-bottom: 1.75rem; flex-grow: 1; }
    .price-features li { padding: 0.5rem 0; border-bottom: 1px solid #f1f5f9; color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: flex-start; gap: 0.5rem; }
    .price-features li::before { content: "✓"; color: var(--primary); font-weight: bold; }
    
    .price-btn { text-align: center; background: var(--bg-light); color: var(--primary); border: 1px solid var(--border); padding: 0.7rem; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.2s; }
    .price-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* A La Carte (Direkte under pakkerne) */
    .alacarte { padding: 2rem 1rem 4rem; max-width: 1150px; margin: 0 auto; }
    .alacarte-box { background: var(--bg-light); padding: 2.5rem 1.5rem; border-radius: 12px; border: 1px solid var(--border); }
    .alacarte h3 { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-dark); }
    .alacarte-intro { text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
    .alacarte-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; }
    .alacarte-item { background: #fff; padding: 1.25rem 1.5rem; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; }
    .alacarte-icon { font-size: 1.3rem; color: var(--primary); }
    .alacarte-text { font-size: 0.9rem; font-weight: 600; color: var(--text-dark); }

    /* Contact & Details Section */
    .contact { padding: 4rem 1rem; background-color: #fff; border-top: 1px solid var(--border); }
    .contact-container { max-width: 900px; margin: 0 auto; }
    .contact h2 { text-align: center; font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; }
    .contact-sub { text-align: center; color: var(--text-muted); margin-bottom: 2.5rem; font-size: 0.95rem; }
    
    .contact-grid { display: grid; grid-template-columns: 1fr; gap: 2.5rem; }
    @media (min-width: 768px) {
      .contact-grid { grid-template-columns: 1fr 1.2fr; }
    }

    .contact-info-box { background: var(--bg-light); padding: 2rem; border-radius: 10px; border: 1px solid var(--border); text-align: left; }
    .contact-info-box h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.25rem; color: var(--text-dark); }
    .info-item { display: flex; align-items: flex-start; gap: 0.75rem; margin-bottom: 1.25rem; font-size: 0.95rem; color: var(--text-dark); }
    .info-item-icon { font-size: 1.2rem; }
    .info-item a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .info-item a:hover { text-decoration: underline; }

    .form-group { margin-bottom: 1.1rem; text-align: left; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; }
    .form-group input, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.95rem; }
    .form-submit { width: 100%; background: var(--primary); color: #fff; border: none; padding: 0.85rem; font-size: 1rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .form-submit:hover { background: var(--primary-hover); }

    /* Footer & Disclaimer */
    footer { text-align: center; padding: 2.5rem 1rem; border-top: 1px solid var(--border); background: var(--bg-light); color: var(--text-muted); font-size: 0.85rem; }
    .ai-disclaimer { margin-top: 0.75rem; font-size: 0.78rem; color: #94a3b8; font-style: italic; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <a href="#" class="logo-container">
        <img src="logo.png" alt="NordicAzur Logo" class="logo-img" onerror="this.style.display='none';">
        <span class="logo-text">NordicAzur</span>
      </a>
      <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="da">Dansk</option>
        <option value="fr">Français</option>
        <option value="nl">Nederlands</option>
        <option value="de">Deutsch</option>
        <option value="sv">Svenska</option>
        <option value="no">Norsk</option>
      </select>
    </div>
    <nav>
      <a href="#services" data-i18n="nav_services">Services</a>
      <a href="#about" data-i18n="nav_about">About</a>
      <a href="#pricing" data-i18n="nav_pricing">Packages</a>
      <a href="#contact" data-i18n="nav_contact">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-grid">
      <div class="hero-content">
        <div class="hero-tag" data-i18n="hero_tag">NORDICAZUR
