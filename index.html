<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NordicAzur - Property Care & Concierge Services</title>
  <style>
    /* Global Styles & Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #0f172a;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }
    a {
      color: #ca8a04;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      background-color: #0b1329;
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    header img {
      height: 38px;
    }
    .logo-text {
      font-weight: 700;
      font-size: 1.3rem;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      flex-wrap: wrap;
    }
    nav a {
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.2rem 0;
    }
    nav a:hover {
      color: #eab308;
      text-decoration: none;
    }
    select {
      background-color: #151f38;
      color: #ffffff;
      border: 1px solid #2a3756;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
    }

    /* Hero Section (Split Layout) */
    .hero-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 3rem;
      align-items: center;
      padding: 4rem 3rem;
      max-width: 1250px;
      margin: 0 auto;
    }
    .sub-tag {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ca8a04;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }
    .hero-text h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 1.2;
      margin-bottom: 1.2rem;
      color: #0f172a;
      font-weight: 700;
    }
    .hero-lead {
      font-size: 1.15rem;
      color: #334155;
      margin-bottom: 1.2rem;
      font-weight: 500;
      line-height: 1.5;
    }
    .hero-p {
      color: #475569;
      margin-bottom: 1.5rem;
      font-size: 0.98rem;
    }
    .hero-bullets {
      list-style: none;
      padding: 0;
      margin-bottom: 2.2rem;
    }
    .hero-bullets li {
      position: relative;
      padding-left: 1.8rem;
      margin-bottom: 0.8rem;
      color: #0f172a;
      font-weight: 600;
      font-size: 0.98rem;
    }
    .hero-bullets li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #ca8a04;
      font-weight: bold;
    }
    .btn-hero {
      display: inline-block;
      background-color: #14382c;
      color: #ffffff;
      font-weight: 700;
      padding: 1rem 2.2rem;
      border-radius: 8px;
      font-size: 1.05rem;
      transition: background-color 0.2s ease;
    }
    .btn-hero:hover {
      background-color: #0d261e;
      color: #ffffff;
      text-decoration: none;
    }
    .hero-subtext {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.8rem;
    }
    .hero-image img {
      width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      object-fit: cover;
    }

    /* Shared Section Styles */
    section {
      padding: 4rem 2rem;
      max-width: 1250px;
      margin: 0 auto;
    }
    section h2 {
      text-align: center;
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      margin-bottom: 1rem;
      color: #0f172a;
      font-weight: 700;
    }
    .section-intro {
      text-align: center;
      color: #64748b;
      max-width: 800px;
      margin: 0 auto 3rem auto;
      font-size: 1.02rem;
    }
    
    /* About Section */
    .about-section {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 3.5rem 2.5rem;
      margin: 2rem auto;
    }
    .about-content {
      max-width: 900px;
      margin: 0 auto;
      font-size: 1.02rem;
      color: #334155;
    }
    .about-content p {
      margin-bottom: 1.2rem;
      line-height: 1.7;
    }
    .about-highlights {
      list-style: none;
      padding: 0;
      margin-top: 1.8rem;
    }
    .about-highlights li {
      position: relative;
      padding-left: 2rem;
      margin-bottom: 1.1rem;
      color: #0f172a;
      line-height: 1.6;
    }
    .about-highlights li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #ca8a04;
      font-weight: bold;
      font-size: 1.1rem;
    }

     /* Why Choose Us Grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.8rem;
      margin-top: 2rem;
    }
    .feature-card {
      background-color: #f8fafc;
      padding: 2.2rem 1.8rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .feature-card .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .feature-card h3 {
      margin-bottom: 0.6rem;
      color: #0f172a;
      font-size: 1.2rem;
    }
    .feature-card p {
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Pricing Section */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.8rem;
      align-items: stretch;
      margin-top: 2rem;
    }
    .pricing-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #0b1329;
      border-radius: 12px;
      padding: 2.2rem 1.8rem;
      color: #ffffff;
      border: 1px solid #1e293b;
    }
    .pricing-card.featured {
      border: 2px solid #eab308;
      position: relative;
    }
    .badge {
      position: absolute;
      top: -14px;
      right: 50%;
      transform: translateX(50%);
      background-color: #eab308;
      color: #0f172a;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.3rem 1rem;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .card-header h3 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #ffffff;
      font-weight: 700;
    }
    .price {
      font-size: 1.8rem;
      font-weight: bold;
      color: #eab308;
    }
    .price span {
      font-size: 0.95rem;
      color: #94a3b8;
      font-weight: normal;
    }
    .commitment {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.2rem;
    }
    .features-list {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0;
      flex-grow: 1;
    }
    .features-list li {
      position: relative;
      padding-left: 1.6rem;
      margin-bottom: 0.85rem;
      font-size: 0.9rem;
      line-height: 1.45;
      color: #e2e8f0;
    }
    .features-list li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #eab308;
      font-weight: bold;
    }
    .btn {
      display: block;
      text-align: center;
      background-color: #1e293b;
      color: #ffffff;
      padding: 0.9rem;
      border-radius: 6px;
      font-weight: 700;
      margin-top: 1rem;
      min-height: 48px;
    }
    .btn:hover {
      background-color: #334155;
      text-decoration: none;
    }
    .btn-primary {
      background-color: #eab308;
      color: #0f172a;
    }
