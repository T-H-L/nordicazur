<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NordicAzur · Property Care & Concierge</title>
  <style>
    :root {
      --primary: #1b4332;
      --primary-hover: #2d6a4f;
      --bg-light: #f8fafc;
      --text-dark: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --accent: #b76e79;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text-dark); background-color: #fff; line-height: 1.6; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 2rem; background: #fff; border-bottom: 1px solid var(--border); max-width: 1200px; margin: 0 auto; }
    .logo-container { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--primary); }
    .logo-img { height: 45px; width: auto; object-fit: contain; }
    .logo-text { font-weight: 800; font-size: 1.35rem; letter-spacing: 0.5px; text-transform: uppercase; color: var(--primary); }
    
    nav { display: flex; align-items: center; }
    nav a { margin-left: 1.5rem; text-decoration: none; color: var(--text-dark); font-weight: 500; font-size: 0.95rem; }
    nav a:hover { color: var(--primary); }
    .lang-select { margin-left: 1.5rem; padding: 0.4rem 0.6rem; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-family: inherit; cursor: pointer; }

    /* Hero Section */
    .hero { padding: 4.5rem 1.5rem 3.5rem; max-width: 1200px; margin: 0 auto; }
    .hero-grid { display: grid; grid-template-columns: 1fr; gap: 2.5rem; align-items: center; }
    @media (min-width: 900px) {
      .hero-grid { grid-template-columns: 1.1fr 0.9fr; }
    }

    .hero-content { text-align: left; }
    .hero-tag { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #8c6d46; margin-bottom: 0.75rem; }
    .hero h1 { font-size: 2.5rem; line-height: 1.2; font-weight: 800; color: var(--text-dark); margin-bottom: 1rem; }
    .hero-lead { font-size: 1.15rem; font-weight: 600; color: var(--text-dark); margin-bottom: 0.75rem; }
    .hero-sublead { font-size: 1rem; color: var(--text-muted); margin-bottom: 1rem; font-style: italic; }
    .hero p { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.6; }

    .hero-checklist { list-style: none; margin-bottom: 2rem; }
    .hero-checklist li { display: flex; align-items: center; gap: 0.75rem; font-size: 1rem; font-weight: 600; color: var(--text-dark); margin-bottom: 0.6rem; }
    .hero-checklist li::before { content: "✓"; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid #8c6d46; color: #8c6d46; font-size: 0.8rem; font-weight: bold; flex-shrink: 0; }

    .btn-cta { display: block; width: 100%; text-align: center; background-color: var(--primary); color: #fff; font-weight: 700; padding: 1rem 1.75rem; border-radius: 8px; text-decoration: none; font-size: 1.05rem; transition: background 0.2s ease; margin-bottom: 0.75rem; }
    .btn-cta:hover { background-color: var(--primary-hover); }
    .cta-note { font-size: 0.875rem; color: var(--text-muted); text-align: center; line-height: 1.4; }

    .hero-image-container { width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 28px rgba(0,0,0,0.1); border: 1px solid var(--border); }
    .hero-img { width: 100%; height: 100%; max-height: 520px; object-fit: cover; display: block; }

    /* About Section */
    .about { padding: 5rem 1.5rem; background-color: var(--bg-light); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .about-container { max-width: 1000px; margin: 0 auto; }
    .about h2 { font-size: 2rem; font-weight: 800; color: var(--text-dark); margin-bottom: 1.25rem; text-align: center; }
    .about-intro { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 1.5rem; text-align: center; max-width: 850px; margin-left: auto; margin-right: auto; line-height: 1.7; }
    .about-lead { font-size: 1.05rem; color: var(--text-dark); margin-bottom: 2.5rem; text-align: center; line-height: 1.7; }
    
    .about-subtitle { font-size: 1.4rem; font-weight: 700; color: var(--text-dark); margin-bottom: 1.75rem; text-align: center; }
    .about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }
    .about-card { background: #fff; padding: 1.75rem; border-radius: 10px; border: 1px solid var(--border); }
    .about-card h3 { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; }
    .about-card p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; }

    .about-footer { margin-top: 3rem; text-align: center; font-size: 1.05rem; font-weight: 600; color: var(--text-dark); max-width: 800px; margin-left: auto; margin-right: auto; }

    /* Pricing Section */
    .pricing { padding: 5rem 1.5rem; max-width: 1150px; margin: 0 auto; }
