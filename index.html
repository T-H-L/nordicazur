<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NordicAzur - Property Care & Concierge Services</title>
  <style>
    /* Global Styles & Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
    }
    a {
      color: #eab308;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background-color: #0b0f19;
      border-bottom: 1px solid #1e293b;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header img {
      height: 40px;
    }
    nav a {
      color: #94a3b8;
      margin: 0 1rem;
      font-weight: 500;
    }
    nav a:hover {
      color: #ffffff;
      text-decoration: none;
    }
    select {
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 5rem 2rem;
      background: linear-gradient(180deg, #0b0f19 0%, #0f172a 100%);
    }
    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    .hero p {
      font-size: 1.2rem;
      color: #94a3b8;
      max-width: 700px;
      margin: 0 auto 2rem auto;
    }
    .btn-hero {
      display: inline-block;
      background-color: #eab308;
      color: #0f172a;
      font-weight: bold;
      padding: 0.8rem 1.8rem;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }
    .btn-hero:hover {
      background-color: #ca8a04;
      text-decoration: none;
    }

    /* Sections Shared */
    section {
      padding: 4rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    section h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    .section-intro {
      text-align: center;
      color: #94a3b8;
      max-width: 800px;
      margin: 0 auto 2.5rem auto;
    }

    /* Why Us Grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    .feature-card {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
    }
    .feature-card .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .feature-card h3 {
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }
    .feature-card p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* Pricing Section */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      align-items: stretch;
      margin-top: 2rem;
    }
    .pricing-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #1e293b;
      border-radius: 12px;
      padding: 2rem;
      color: #ffffff;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .pricing-card.featured {
      border: 2px solid #eab308;
      position: relative;
    }
    .badge {
      position: absolute;
      top: -12px;
      right: 20px;
      background-color: #eab308;
      color: #0f172a;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 0.2rem 0.8rem;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .card-header h3 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .price {
      font-size: 1.8rem;
      font-weight: bold;
      color: #eab308;
    }
    .price span {
      font-size: 1rem;
      color: #94a3b8;
      font-weight: normal;
    }
    .commitment {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.2rem;
    }

    /* Features List */
    .features-list {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0;
      flex-grow: 1;
    }
